<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" role="img" aria-labelledby="title desc">
  <title id="title">Atezolizumab and bevacizumab side-effect body map</title>
  <desc id="desc">Large anatomical body silhouette. The heart and lungs sit in the chest, liver is on the person's right, kidneys are in the upper abdomen, bowel in the lower abdomen, and brain in the head. Purple icons identify immune effects. Coral icons identify bevacizumab blood-vessel, jaw and healing effects.</desc>
  <defs>
    <linearGradient id="body" x2="0" y2="1"><stop stop-color="#d3e5ec"/><stop offset="1" stop-color="#abcbd8"/></linearGradient>
    <style>
      .outline{fill:url(#body);stroke:#638a9d;stroke-width:2.4;stroke-linejoin:round}
      .immune{fill:#fff;stroke:#654b95;stroke-width:3}
      .vessel{fill:#fff;stroke:#ad503d;stroke-width:3}
      .organ{fill:none;stroke:#654b95;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
      .risk{fill:none;stroke:#ad503d;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .leader{fill:none;stroke:#a4b8c1;stroke-width:2}
      .label{font:700 15px Arial,sans-serif;fill:#223d4a}
      .sub{font:500 12px Arial,sans-serif;fill:#526b75}
    </style>
  </defs>
  <rect width="500" height="600" rx="20" fill="#f3f8f9"/>
  <circle cx="250" cy="64" r="41" class="outline"/>
  <path class="outline" d="M232 105h36l7 24c20 2 38 12 48 33l26 113c5 18-6 27-17 26-9-1-12-7-15-18l-26-83 3 146-16 3-14-110-14 9-14-9-14 110-16-3 3-146-26 83c-3 11-6 17-15 18-11 1-22-8-17-26l26-113c10-21 28-31 48-33z"/>
  <path class="outline" d="M211 343h29l10 24 10-24h29l9 226c1 11-8 16-22 16-13 0-17-7-19-18l-7-130-7 130c-2 11-6 18-19 18-14 0-23-5-22-16z"/>
  <g class="leader">
    <path d="M49 63h155M292 184h153M48 271h162M290 276h164M54 352h156M291 407h158"/>
  </g>
  <g>
    <circle cx="250" cy="63" r="26" class="immune"/><circle cx="217" cy="186" r="28" class="immune"/>
    <circle cx="277" cy="190" r="22" class="immune"/><circle cx="219" cy="266" r="25" class="immune"/>
    <circle cx="272" cy="279" r="24" class="immune"/><circle cx="251" cy="349" r="25" class="immune"/>
    <circle cx="282" cy="407" r="23" class="immune"/><circle cx="317" cy="107" r="20" class="vessel"/>
    <circle cx="347" cy="246" r="20" class="vessel"/>
  </g>
  <!-- Brain and glands -->
  <path class="organ" d="M250 48c-5-9-16-7-18 0-10 0-10 14-3 17-3 9 7 16 15 11 4 7 12 7 16 0 8 5 18-2 15-11 7-3 7-17-3-17-2-7-13-9-18 0v29"/>
  <!-- Both lungs -->
  <path class="organ" d="M215 165v12c-7-10-15-4-16 7l-2 14c0 18 19 18 21 4v-18m-1-7c7-10 15-4 16 7l2 14c0 18-19 18-21 4v-18"/>
  <!-- Heart anatomically on patient left -->
  <path class="organ" d="M277 203l-12-12c-11-12 5-20 12-10 7-10 23-2 12 10z"/>
  <!-- Liver on patient's right, viewer's left -->
  <path class="organ" d="M201 261c10-13 34-15 39-4 7 15-14 27-39 15z"/>
  <!-- Kidneys in upper abdomen -->
  <path class="organ" d="M264 269c-11-8-17 15-4 18 6 2 8-6 8-10m13-8c11-8 17 15 4 18-6 2-8-6-8-10"/>
  <!-- Bowel in lower abdomen -->
  <path class="organ" d="M238 335h25v25h-25zm0 8h25m-18 0v17m11-17v17"/>
  <!-- Muscle / nerve and skin -->
  <path class="organ" d="M276 398l6 6-4 3 9 0 0 8 7-3m-19-12-1 17"/>
  <!-- Jaw and blood vessel -->
  <path class="risk" d="M306 102c8-7 11 3 22 0v13c-2 7-18 7-22 0z"/>
  <path class="risk" d="M338 232v27m0-17-8 7m8-1 8 7"/>
  <g>
    <text class="label" x="22" y="47">Brain + hormones</text><text class="sub" x="22" y="65">Headache, thirst</text>
    <text class="label" x="363" y="179">Lungs + heart</text><text class="sub" x="363" y="197">Cough, chest pain</text>
    <text class="label" x="22" y="255">Liver</text><text class="sub" x="22" y="273">Yellow eyes</text>
    <text class="label" x="361" y="271">Kidneys</text><text class="sub" x="361" y="289">Urine changes</text>
    <text class="label" x="22" y="344">Bowel</text><text class="sub" x="22" y="362">Diarrhoea</text>
    <text class="label" x="357" y="398">Skin + muscles</text><text class="sub" x="357" y="416">Rash, weakness</text>
    <text class="label" x="341" y="111" fill="#ad503d">Jaw</text>
    <text class="label" x="370" y="244" fill="#ad503d">Vessels / BP</text>
  </g>
  <text x="23" y="563" fill="#654b95" font-family="Arial,sans-serif" font-size="13" font-weight="700">● Immune inflammation</text>
  <text x="259" y="563" fill="#ad503d" font-family="Arial,sans-serif" font-size="13" font-weight="700">● Bevacizumab risks</text>
</svg>
