name: Protocol-content discrepancy
about: Report a possible mismatch with an official NCCP protocol
title: "[Protocol review] "
labels: [clinical-review]
body:
  - type: markdown
    attributes:
      value: |
        Do not include patient-identifiable information. Link only to the official source and describe the rule discrepancy using de-identified example values.
  - type: input
    id: regimen
    attributes:
      label: Regimen and NCCP number
      placeholder: e.g. Modified FOLFOX-6 — NCCP 00209
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official NCCP source and version
      placeholder: Paste the official HSE/NCCP URL and protocol version
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: Suspected discrepancy
      description: State the SACTCheck output and the source criterion that appears inconsistent.
    validations:
      required: true
  - type: dropdown
    id: potential_impact
    attributes:
      label: Potential impact
      options:
        - Wording/display only
        - Could produce an unnecessary review or hold
        - Could fail to identify a required review or hold
        - Dose-modification discrepancy
        - Source/version mismatch
        - Uncertain
    validations:
      required: true
