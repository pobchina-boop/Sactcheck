name: Technical bug
about: Report a reproducible application or interface defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include names, MRNs, dates of birth, screenshots containing patient information, or real clinical case details.
  - type: input
    id: version
    attributes:
      label: SACTCheck version
      placeholder: e.g. v0.48.0
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device/browser
      options:
        - Windows / Chrome
        - Windows / Edge
        - macOS / Safari
        - iPhone / Safari
        - Android / Chrome
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not include patient-identifiable information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
