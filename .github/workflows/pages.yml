name: Deploy SACTCheck Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate production site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run repository security checks
        run: npm run security:check

      - name: Rebuild generated protocol artefacts
        run: npm run protocols:build

      - name: Confirm generated artefacts are committed
        run: git diff --exit-code -- protocols/index.json data/regimen-card-metadata.json REGIMEN_CARD_METADATA_REVIEW.csv

      - name: Run complete regression suite
        run: npm test

      - name: Build allowlisted Pages artefact
        run: npm run build:pages

      - name: Validate deployable site contents
        run: npm run security:site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy production site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
