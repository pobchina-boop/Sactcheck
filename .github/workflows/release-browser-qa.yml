name: Release candidate browser verification
on:
  push:
    branches: [qa/olaparib-only-browser-20261124]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: validation/release-browser-check.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: 3d40d61875c1d895b7b1d8ce8916972e4f83ae75
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned browser client
        run: npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false playwright@1.56.1
      - name: Build exact release candidate
        working-directory: candidate
        run: npm run build:pages
      - name: Exercise affected portals, downloads and mobile disclosures
        working-directory: candidate
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          SACT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
          SACT_EVIDENCE: ${{ runner.temp }}/evidence
        run: node ../validation/release-browser-check.cjs
      - name: Exercise existing clinician and patient journeys
        if: success() || failure()
        working-directory: candidate
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          SACT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
          SACT_SITE_DIR: ${{ github.workspace }}/candidate/_site
          SACT_VISUAL_DIR: ${{ runner.temp }}/evidence/navigation
          SACT_WORKFLOW_EVIDENCE_DIR: ${{ runner.temp }}/evidence/workflow
          SACT_CONTRAST_EVIDENCE_DIR: ${{ runner.temp }}/evidence/contrast
          SACT_CLINICAL_EVIDENCE_DIR: ${{ runner.temp }}/evidence/clinical
        run: npm run test:patient-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
